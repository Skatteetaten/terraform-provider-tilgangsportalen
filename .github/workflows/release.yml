# Workflow for Terraform Provider for Tilgangsportalen.
#
# This workflow creates a release when a tag that matches the defined pattern
# is created (e.g. v0.1.0).
# The workflow uses a GitHub action crazy-max/ghaction-import-gpg and GitHub
# action secrets`GPG_PRIVATE_KEY` and `PASSPHRASE` that need to be set.
# GitHub will set the GITHUB_TOKEN secret used by goreleaser/goreleaser-action
# automatically.

---
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Uses the toolchain directive in go.mod (GO_TOOLCHAIN_VERSION in GNUmakefile)
          go-version-file: "go.mod"
          cache: false
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
