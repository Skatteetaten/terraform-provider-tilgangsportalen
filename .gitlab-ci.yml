---
include:
  - project: "azure-tools/ci-templates/tools"
    ref: "3.17.5"
    file:
      - "Linter.gitlab-ci.yml"

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "release"

.feature-branch:
  rules:
    - if: $CI_COMMIT_REF_NAME == "release"
      when: never
    - when: on_success

stages:
  - test
  - release

variables:
  IMAGE_GO: "gitlab-container-registry.skead.no/kjerneplattform-container-registry/core/go:0"

# Feature branch stages

megalinter-terraform-projects:
  extends: .megalinter-go
  allow_failure: true
  rules:
    - !reference [.feature-branch, rules]

go package code examination:
  image: ${IMAGE_GO}
  stage: .pre
  script:
    - go vet ./...
  rules:
    - !reference [.feature-branch, rules]
  tags:
    - intern

go security scanning:
  image: ${IMAGE_GO}
  stage: .pre
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec ./...
  rules:
    - !reference [.feature-branch, rules]
  tags:
    - intern

# Run integration tests for Terraform provider on merge requests (into main and into release)
.integration tests base:
  image: ${IMAGE_GO}
  stage: test
  script:
    - echo "Prepare Go integration tests for provider"
    - |
      # Get all test functions from the specified test files and run them
      TEST_FUNCTIONS=$(printf "%s\n" $TEST_FILES \
        | sed 's|^|internal/provider/|' \
        | xargs grep -h "^func Test" 2>/dev/null \
        | sed 's/func \(Test[^(]*\).*/\1/' \
        | paste -sd '|' - || true)

      if [ -n "$TEST_FUNCTIONS" ]; then
        echo "Running integration tests for files: $TEST_FILES"
        echo "Tests:"
        echo "$TEST_FUNCTIONS" | tr '|' '\n'

        TF_ACC=1 go test -cover -timeout=30m -v -run "^((${TEST_FUNCTIONS}))$" ./...
      else
        echo "ERROR: No tests found"
        exit 1
      fi

  environment:
    name: dev
    action: verify
    deployment_tier: development
  rules:
    - if: $CI_COMMIT_REF_NAME == "release"
      when: never
    - when: manual
  tags:
    - intern

integration tests entra group:
  extends: .integration tests base
  variables:
    TEST_FILES: >
      data_source_entra_group_test.go
      resource_entra_group_test.go
      data_source_list_entra_groups_test.go

integration tests system role:
  extends: .integration tests base
  variables:
    TEST_FILES: >
      data_source_system_role_test.go
      resource_system_role_test.go
      data_source_list_system_roles_test.go

integration tests role assignment:
  extends: .integration tests base
  variables:
    TEST_FILES: >
      data_source_entra_group_role_assignment_test.go
      resource_entra_group_role_assignment_test.go
      data_source_list_all_system_roles_for_entra_group_test.go
      data_source_list_entra_groups_assigned_to_role_test.go

integration tests terms of use role assignment:
  extends: .integration tests base
  variables:
    TEST_FILES: >
      data_source_terms_of_use_role_assignment_test.go
      resource_terms_of_use_role_assignment_test.go

# Release branch NB: This does nothing yet. Should add tag later.
github release:
  image: ${IMAGE_GO}
  stage: release
  script:
    - echo "Sync with GitHub - remember to add tag"
  environment:
    name: prod
    action: verify
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_REF_NAME == "release"
      when: on_success
    - when: never
  tags:
    - intern
